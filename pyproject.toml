[project]
name = "nz-octopus"
version = "0.1.0"
description = "A 2D aquarium where bacteria live, learn and share knowledge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["rich>=13", "pygame-ce>=2.5"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["src", "main.py", "tests"]

[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]
