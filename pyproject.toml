[project]
name = "nz-octopus"
version = "0.1.0"
description = "A single 2D octopus AI that lives and learns in an aquarium"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["rich>=13", "pygame-ce>=2.5"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["sim", "canvas.py", "tui.py"]

[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]
